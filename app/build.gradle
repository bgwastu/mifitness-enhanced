plugins {
    id 'com.android.application'
}

android {
    namespace 'net.wastu.mifitness.enhanced'
    compileSdk 34

    defaultConfig {
        applicationId "net.wastu.mifitness.enhanced"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
